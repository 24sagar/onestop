{% extends "base.html" %}

  {% block content %}
  
    
  <div class="container">
    <div class="form-container">
        <h2 class="text-center">Login</h2>

        <form method = "POST" action = "{% url 'login' %}">
            {% csrf_token %}
            <!-- Display non-field errors (e.g., incorrect username/password combination) -->
            {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {{ form.non_field_errors }}
            </div>
            {% endif %}

            <!-- Email Field -->
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                <input type="text" class="form-control {% if form.username.errors %}is-invalid{% endif %}" 
                       name="{{ form.username.name }}" placeholder="Enter username" >
                <!-- Display field-specific errors  value="{{ form.username.value }}"-->
                <div class="invalid-feedback">
                    {{ form.username.errors }}
                </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                <input type="password" class="form-control {% if form.password.errors %}is-invalid{% endif %}" 
                       name="{{ form.password.name }}" placeholder="Enter password">
                <!-- Display field-specific errors -->
                <div class="invalid-feedback">
                    {{ form.password.errors }}
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
        </div>
    </div>
</div>

  {% endblock %}
