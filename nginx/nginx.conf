

# Redirect HTTP traffic to HTTPS
server {
    listen 80;
    server_name onestopsolutions.one www.onestopsolutions.one;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server block for secure connections
server {
    listen 443 ssl;
    server_name onestopsolutions.one www.onestopsolutions.one;

    # SSL Certificate settings (replace with your own cert paths)
    ssl_certificate /etc/ssl/certs/your_cert.crt;
    ssl_certificate_key /etc/ssl/private/your_cert.key;

    # Security headers (optional but recommended)
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Serve static files
    location /static/ {
        alias /home/ubuntu/OneStopSolutions/static/;  # Adjust to your static folder path
        expires 30d;  # Cache static files for 30 days
    }

    # Serve media files (optional, if you have media files)
    location /media/ {
        alias /home/ubuntu/OneStopSolutions/media/;  # Adjust to your media folder path
        expires 30d;  # Cache media files for 30 days
    }

    # Gunicorn reverse proxy
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass http://unix:/run/gunicorn.sock;
        client_max_body_size 10M;  # Adjust if you're handling large file uploads
    }

    # Favicon (optional, if you don't want to log favicon requests)
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
}
