{% extends "base.html" %}

{% block content %}

    <!-- BREADCRUMB -->
    <div id="breadcrumb" class="section">
        <!-- container -->
        <div class="container">
            <!-- row -->
            <div class="row">
                <div class="col-md-12">
                    <h3 class="breadcrumb-header">Checkout</h3>
                </div>
            </div>
            <!-- /row -->
        </div>
        <!-- /container -->
    </div>
    <!-- /BREADCRUMB -->

    <!-- SECTION -->
    <div class="section">
        <!-- container -->
        <div class="container">
            <!-- row -->
            <div class="row">

                <div class="col-md-7">
                    <!-- Billing Details -->

                     <form method="POST" action="{% url 'place_order' %}">
                        {% csrf_token %}
                        <div class="billing-details">
                            <div class="section-title">
                                <h3 class="title">Address</h3>
                            </div>
                            <div class="form-group">
                                <input class="input" type="text" name="first_name" placeholder="First Name" 
                                       value="{% if form.first_name and form.first_name.value %}{{ form.first_name.value }}{% elif address and address.first_name %}{{ address.first_name }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <input class="input" type="text" name="last_name" placeholder="Last Name" 
                                       value="{% if form.last_name and form.last_name.value %}{{ form.last_name.value }}{% elif address and address.last_name %}{{ address.last_name }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <input class="input" type="email" name="email" placeholder="Email" 
                                       value="{% if form.email and form.email.value %}{{ form.email.value }}{% elif address and address.email %}{{ address.email }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <input class="input" type="text" name="address" placeholder="Address" 
                                       value="{% if form.address and form.address.value %}{{ form.address.value }}{% elif address and address.address %}{{ address.address }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <input class="input" type="text" name="city" placeholder="City" 
                                       value="{% if form.city and form.city.value %}{{ form.city.value }}{% elif address and address.city %}{{ address.city }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <input class="input" type="text" name="country" placeholder="Country" 
                                       value="{% if form.country and form.country.value %}{{ form.country.value }}{% elif address and address.country %}{{ address.country }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <input class="input" type="text" name="zip_code" placeholder="ZIP Code" 
                                       value="{% if form.zip_code and form.zip_code.value %}{{ form.zip_code.value }}{% elif address and address.zip_code %}{{ address.zip_code }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <input class="input" type="tel" name="phone" placeholder="Telephone" 
                                       value="{% if form.phone and form.phone.value %}{{ form.phone.value }}{% elif address and address.phone %}{{ address.phone }}{% else %}{% endif %}" required>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="primary-btn order-submit">Submit and Pay</button>
                            </div>
                        </div>
                    </form>
                    <!-- /Billing Details -->
                </div>

                <div class="col-md-5 order-details">
                    <div class="section-title text-center">
                        <h3 class="title">Your Order</h3>
                    </div>
                    <div class="order-summary">
                        <div class="order-col">
                            <div><strong>PRODUCT</strong></div>
                            <div><strong>TOTAL</strong></div>
                        </div>
                        <div class="order-products">
                            {% for item in cart_products %}
                            <div class="order-col">
                                <div>{{ item.quantity }} x {{ item.name }}</div>
                                <div>₹{{ item.total_price }}</div>
                            </div>
                            {% endfor %}
                        </div>
                        <div class="order-col">
                            <div>Shipping</div>
                            <div><strong>FREE</strong></div>
                        </div>
                        <a href="{% url 'clear_cart' %}" class="btn btn-danger">Clear Cart</a>
                        <div class="order-col">
                            <div><strong>TOTAL</strong></div>
                            <div><strong class="order-total">₹{{ total_price }}</strong></div>
                        </div>
                    </div>
                </div>
                <!-- /Order Details -->
            </div>
            <!-- /row -->
        </div>
        <!-- /container -->
    </div>
    <!-- /SECTION -->

{% endblock %}
