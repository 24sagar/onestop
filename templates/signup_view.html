{% extends "base.html" %}

  {% block content %}
  <div class="container">
    <div class="form-container">
        <h2 class="text-center">Sign Up</h2>

        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            <!-- Display non-field errors (e.g., password mismatch) -->
            {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {{ form.non_field_errors }}
            </div>
            {% endif %}

            <!-- Username Field -->
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                <input type="text" class="form-control {% if form.username.errors %}is-invalid{% endif %}" 
                       name="{{ form.username.name }}" placeholder="Enter username" >
                <!-- Display field-specific errors value="{{ form.username.value }}" -->
                <div class="invalid-feedback">
                    {{ form.username.errors }}
                </div>
            </div>

            <!-- Password1 Field -->
            <div class="mb-3">
                <label for="{{ form.password1.id_for_label }}" class="form-label">Password</label>
                <input type="password" class="form-control {% if form.password1.errors %}is-invalid{% endif %}" 
                       name="{{ form.password1.name }}" placeholder="Enter password">
                <!-- Display field-specific errors -->
                <div class="invalid-feedback">
                    {{ form.password1.errors }}
                </div>
            </div>

            <!-- Password2 Field -->
            <div class="mb-3">
                <label for="{{ form.password2.id_for_label }}" class="form-label">Confirm Password</label>
                <input type="password" class="form-control {% if form.password2.errors %}is-invalid{% endif %}" 
                       name="{{ form.password2.name }}" placeholder="Confirm password">
                <!-- Display field-specific errors -->
                <div class="invalid-feedback">
                    {{ form.password2.errors }}
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">Sign Up</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
        </div>
    </div>
</div>

  {% endblock %}
