<!DOCTYPE html>
<html>

<head>
  {% load static %}
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Site Metas -->
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content=""/>

  <title>One Stop Solutions</title>
  

  <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

  <!-- slider stylesheet -->
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="hero_area">
    <header class="header_section">
      <div class="header_bottom">
        <div class="container-fluid">
          <nav class="navbar navbar-expand-lg custom_nav-container ">
            <a class="navbar-brand" href="/">
              <span>One Stop Solutions</span>
            </a>
    
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class=""> </span>
            </button>
    
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ">
                <li class="nav-item active">
                  <a class="nav-link" href="/">Home</a>
                </li>
    
                <!-- User Authentication Dropdown -->
                <li class="nav-item dropdown">
                  {% if user.is_authenticated %}
                    <!-- Dropdown for authenticated users -->
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                      <i class="fa fa-user"></i> {{ user.username }}
                    </a>
                    <div class="dropdown">
                      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                        <!-- Check if the user has a recent order -->
                        {% if recent_order %}
                          <a class="dropdown-item order-history" href="{% url 'order_history' %}"><i class="fa fa-list"></i> Order History</a>
                        {% endif %}
                        <a class="dropdown-item logout" href="/logout"><i class="fa fa-sign-out-alt"></i> Logout</a>
                      </div>
                    </div>
                  {% else %}
                    <!-- Show login option for non-authenticated users -->
                    <a class="nav-link" href="/login"><i class="fa fa-user"></i> Login</a>
                  {% endif %}
                </li>
    
                <!-- Cart -->
                <li class="nav-item">
                  {% if user.is_authenticated %}
                    <a class="nav-link" href="/cart"><i class="fa fa-shopping-cart"></i> Your Cart</a>
                  {% else %}
                    <a class="nav-link" href="/login"><i class="fa fa-shopping-cart"></i> Your Cart</a>
                  {% endif %}
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
    </header>
